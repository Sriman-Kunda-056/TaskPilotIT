<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login · TaskPilot IT Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
    }
    .auth-wrap {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo .logo-icon {
      font-size: 2.5rem;
      color: var(--cyan);
      display: block;
    }
    .auth-logo .logo-text {
      font-family: var(--mono);
      font-size: 1.1rem;
      color: var(--text2);
      margin-top: .3rem;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }
    .auth-card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text1);
      margin: 0 0 1.5rem;
    }
    .auth-field { margin-bottom: 1.1rem; }
    .auth-field label {
      display: block;
      font-size: .78rem;
      color: var(--text3);
      font-family: var(--mono);
      margin-bottom: .35rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .auth-field input {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text1);
      font-size: .92rem;
      padding: .6rem .75rem;
      outline: none;
      transition: border-color .15s;
    }
    .auth-field input:focus { border-color: var(--cyan); }
    .auth-error {
      background: rgba(248,81,73,.12);
      border: 1px solid rgba(248,81,73,.35);
      border-radius: 6px;
      color: #f85149;
      font-size: .82rem;
      padding: .6rem .85rem;
      margin-bottom: 1.1rem;
    }
    .auth-submit {
      width: 100%;
      margin-top: .5rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: .8rem;
      color: var(--text3);
    }
    .auth-footer a { color: var(--cyan); text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 2.5rem; }
    .pw-toggle {
      position: absolute;
      right: .6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      font-size: .9rem;
      padding: 0;
    }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <span class="logo-icon">⬡</span>
    <div class="logo-text">IT<strong>Ops</strong> · TaskPilot</div>
  </div>

  <div class="auth-card">
    <h2>Sign in to your account</h2>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="auth-field">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username"
               placeholder="admin" required autofocus/>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="login-pw"
                 autocomplete="current-password" placeholder="••••••••" required/>
          <button type="button" class="pw-toggle"
                  onclick="var f=document.getElementById('login-pw');
                           f.type=f.type==='password'?'text':'password';
                           this.textContent=f.type==='password'?'👁':'🙈';">👁</button>
        </div>
      </div>
      <button type="submit" class="btn auth-submit">Sign In →</button>
    </form>
  </div>

  <div class="auth-footer">
    <a href="/forgot-password">Forgot password?</a>
  </div>
</div>
</body>
</html>

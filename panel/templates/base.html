<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>{% block title %}IT Ops{% endblock %} · TaskPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">IT<strong>Ops</strong></span>
    </div>

    <nav class="sidebar-nav">
      <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
        <span class="nav-icon">◈</span><span>Dashboard</span>
      </a>
      <a href="/users" class="nav-item {% if '/users' in request.path %}active{% endif %}">
        <span class="nav-icon">◉</span><span>Users</span>
      </a>
      <a href="/licenses" class="nav-item {% if '/licenses' in request.path %}active{% endif %}">
        <span class="nav-icon">◇</span><span>Licenses</span>
      </a>
      <a href="/logs" class="nav-item {% if '/logs' in request.path %}active{% endif %}">
        <span class="nav-icon">◫</span><span>Logs</span>
      </a>
      <a href="/agent" class="nav-item {% if '/agent' in request.path %}active{% endif %}">
        <span class="nav-icon">◎</span><span>AI Agent</span>
      </a>
    </nav>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-title">{% block page_title %}{% endblock %}</div>
      <div class="topbar-right">
        <span class="topbar-time" id="clock"></span>
        <span style="font-family:var(--mono);font-size:.72rem;color:var(--text3);
                     border-left:1px solid var(--border);padding-left:.75rem;margin-left:.25rem">
          {{ session.get('admin_username','') }}
        </span>
        <a href="/logout"
           style="font-size:.72rem;color:var(--text3);text-decoration:none;
                  border:1px solid var(--border);border-radius:4px;
                  padding:.2rem .55rem;margin-left:.4rem;font-family:var(--mono)"
           title="Sign out">⎋ out</a>
      </div>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    const clockEl = document.getElementById('clock');
    function tick() {
      clockEl.textContent = new Date().toLocaleTimeString('en-US', {hour12:false});
    }
    tick(); setInterval(tick, 1000);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
